name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cardvault, POSTGRES_PASSWORD: cardvault, POSTGRES_DB: cardvault }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardvault" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Migrations apply cleanly
        run: pnpm db:migrate && pnpm db:seed --demo
        env:
          DATABASE_URL: postgres://cardvault:cardvault@localhost:5432/cardvault
